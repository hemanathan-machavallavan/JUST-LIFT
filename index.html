<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4b0b"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Just Lift</title><style>:root{--bg:#08090b;--card:#151619;--line:#292a2f;--txt:#f6f6f6;--muted:#858790;--a:#ff4b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Arial,sans-serif}.app{max-width:560px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:900}.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:10px 13px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:14px}.hero{background:linear-gradient(145deg,#202125,#151619)}h1{font-size:29px;margin:10px 0 6px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#202125;border-radius:15px}.num{font-size:25px;font-weight:900}.pill{display:inline-block;background:#292a2f;color:#bbb;padding:7px 10px;border-radius:99px;font-size:12px;font-weight:bold}.accent{color:var(--a)}button{cursor:pointer}input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;margin:5px 0 10px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.exercise{padding:14px 0;border-top:1px solid var(--line)}.sets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.set{display:grid;grid-template-columns:34px 1fr 1fr;gap:5px;align-items:center}.set b{text-align:center}.primary{width:100%;background:var(--a);color:#101010;border:0;border-radius:12px;padding:13px;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#111216ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:var(--muted);padding:5px}.nav .active{color:var(--a)}.screen{display:none}.screen.active{display:block}.history{max-height:280px;overflow:auto}.small{font-size:12px}</style></head><body><main class="app"><div class="top"><div class="brand">JUST LIFT</div><button class="btn" onclick="toggleTheme()">◐</button></div><section id="home" class="screen active"><div class="hero"><span class="pill">TODAY'S SESSION</span><h1 id="todayName"></h1><div class="muted" id="todaySub"></div><button class="primary" style="margin-top:18px" onclick="openWorkout()">Start workout →</button></div><div class="grid"><div class="stat"><div class="muted">Bodyweight</div><div class="num" id="homeWeight">—</div></div><div class="stat"><div class="muted">Workouts logged</div><div class="num" id="count">0</div></div></div></section><section id="workout" class="screen"><button class="btn" onclick="show('home')">← Back</button><div class="hero"><span class="pill">TODAY</span><h1 id="workoutTitle"></h1><div class="muted">Previous performance is shown below.</div></div><div id="exerciseList"></div><button class="primary" onclick="saveWorkout()">Save workout ✓</button></section><section id="history" class="screen"><h1>History</h1><div class="card history" id="historyList"></div></section><section id="progress" class="screen"><h1>Progress</h1><div class="card"><div class="muted">Best logged weights</div><div id="progressList"></div></div></section><section id="body" class="screen"><h1>Body</h1><div class="card"><label>Date</label><input type="date" id="bodyDate"><div class="grid"><div>Weight<input id="bw" type="number" step="0.1"></div><div>Waist<input id="waist" type="number" step="0.1"></div><div>Chest<input id="chest" type="number" step="0.1"></div><div>Arm<input id="arm" type="number" step="0.1"></div><div>Thigh<input id="thigh" type="number" step="0.1"></div></div><button class="primary" onclick="saveBody()">Save this day ✓</button></div><div class="card"><b>Daily records</b><div id="bodyHistory" class="history"></div></div><div class="card"><b>Data backup</b><p class="muted small">Data stays on this device. Export before reinstalling or changing versions.</p><div class="row"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="importData()">Import backup</button></div></div></section></main><nav class="nav"><button class="active" onclick="nav('home',this)">⌂<br><span>Home</span></button><button onclick="nav('history',this)">▣<br><span>History</span></button><button onclick="nav('progress',this)">▥<br><span>Progress</span></button><button onclick="nav('body',this)">◉<br><span>Body</span></button></nav><script>const KEY='justLiftDBv1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{weights:[],bodyHistory:{},logs:{},theme:'dark',days:[{name:'Push A',ex:[['Bench Press',3,5,8],['Incline DB Press',3,6,10],['DB Shoulder Press',2,6,10],['Cable Lateral Raise',4,12,20],['Cable Fly',2,10,15],['Triceps Pushdown',3,8,12]]},{name:'Pull A',ex:[['Pull-up',4,5,8],['Barbell Row',3,6,8],['Lat Pulldown',3,8,12],['Chest-Supported Row',2,8,12],['Reverse Pec Deck',3,12,20],['Incline DB Curl',3,8,12]]},{name:'Legs A',ex:[['Back Squat',3,5,8],['RDL',3,6,10],['Leg Press',3,8,12],['Leg Curl',3,10,15],['Standing Calf Raise',4,8,15],['Hanging Leg Raise',3,8,15]]},{name:'Push B',ex:[['Incline DB Press',3,8,10],['Machine Chest Press',3,8,12],['Cable Fly',2,12,15],['Cable Lateral Raise',4,12,20],['Dips',2,6,12],['Triceps Extension',3,10,15]]},{name:'Pull B',ex:[['Lat Pulldown',3,6,10],['Chest-Supported Row',3,8,12],['Single-Arm Lat Pulldown',2,10,15],['Seated Cable Row',3,8,12],['Reverse Pec Deck',3,12,20],['Preacher Curl',3,8,12]]},{name:'Legs B',ex:[['Front Squat',3,6,10],['Bulgarian Split Squat',3,8,12],['RDL',2,8,10],['Leg Extension',3,10,15],['Seated Leg Curl',3,10,15],['Seated Calf Raise',4,10,15],['Cable Crunch',3,10,15]]}]};function save(){localStorage.setItem(KEY,JSON.stringify(db))}function date(){return new Date().toISOString().slice(0,10)}function dayIndex(){return (new Date().getDay()+6)%7%6}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='history')renderHistory();if(id==='progress')renderProgress();if(id==='body')renderBody()}function nav(id,b){show(id);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function toggleTheme(){db.theme=db.theme==='dark'?'orange':'dark';document.documentElement.style.setProperty('--bg',db.theme==='orange'?'#35363a':'#08090b');save()}function current(){return db.days[dayIndex()]}function findPrev(name){let ds=Object.keys(db.logs).filter(d=>d<date()&&db.logs[d].name===name).sort().reverse();return ds[0]?db.logs[ds[0]]:null}function openWorkout(){let w=current(),p=findPrev(w.name);document.getElementById('workoutTitle').textContent=w.name;document.getElementById('exerciseList').innerHTML=w.ex.map((e,i)=>{let old=p?.ex?.[e[0]]||[];return `<div class="exercise"><b>${e[0]}</b><div class="muted small">${e[1]} sets × ${e[2]}–${e[3]} reps${old.length?' · Previous: '+old.map(s=>s.w+'×'+s.r).join(', '):''}</div>${Array.from({length:e[1]},(_,j)=>`<div class="set"><b>${j+1}</b><input class="wt" type="number" step="0.5" placeholder="kg" value="${old[j]?.w||''}"><input class="rp" type="number" placeholder="reps" value="${old[j]?.r||''}"></div>`).join('')}</div>`}).join('');show('workout')}function saveWorkout(){let w=current(),o={name:w.name,ex:{}};document.querySelectorAll('.exercise').forEach((el,i)=>{o.ex[w.ex[i][0]]=[];el.querySelectorAll('.set').forEach(s=>{let a=s.querySelector('.wt').value,r=s.querySelector('.rp').value;if(a&&r)o.ex[w.ex[i][0]].push({w:+a,r:+r})})});db.logs[date()]=o;save();document.getElementById('count').textContent=Object.keys(db.logs).length;show('home');alert('Workout saved ✓')}function renderHistory(){let ds=Object.keys(db.logs).sort().reverse();document.getElementById('historyList').innerHTML=ds.length?ds.map(d=>`<p><b>${d}</b> · ${db.logs[d].name}</p>`).join(''):'<p class="muted">No workouts logged yet.</p>'}function renderProgress(){let a={};Object.values(db.logs).forEach(l=>Object.entries(l.ex).forEach(([n,s])=>s.forEach(x=>a[n]=Math.max(a[n]||0,x.w))));document.getElementById('progressList').innerHTML=Object.keys(a).length?Object.entries(a).map(x=>`<p><b>${x[0]}</b><br><span class="accent">${x[1]} kg</span></p>`).join(''):'<p class="muted">Log workouts to see strength progress.</p>'}function renderBody(){let d=document.getElementById('bodyDate');if(!d.value)d.value=date();loadBody(d.value);let h=db.bodyHistory;document.getElementById('bodyHistory').innerHTML=Object.keys(h).sort().reverse().slice(0,30).map(k=>`<p onclick="loadBody('${k}')"><b>${k}</b> · ${h[k].weight||'—'} kg · waist ${h[k].waist||'—'} cm</p>`).join('')||'<p class="muted">No body records yet.</p>'}function loadBody(d){let x=db.bodyHistory[d]||{};bw.value=x.weight||'';waist.value=x.waist||'';chest.value=x.chest||'';arm.value=x.arm||'';thigh.value=x.thigh||'';bodyDate.value=d}function saveBody(){let d=bodyDate.value||date(),x={weight:+bw.value||null,waist:+waist.value||null,chest:+chest.value||null,arm:+arm.value||null,thigh:+thigh.value||null};db.bodyHistory[d]=x;if(x.weight){let i=db.weights.findIndex(a=>a.date===d);i<0?db.weights.push({date:d,weight:x.weight}):db.weights[i].weight=x.weight;homeWeight.textContent=x.weight+' kg'}save();renderBody();alert('Saved ✓')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='just-lift-backup.json';a.click()}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();location.reload()}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])};i.click()}todayName.textContent=current().name;todaySub.textContent=current().ex.length+' exercises · progressive overload';count.textContent=Object.keys(db.logs).length;let q=db.weights.find(x=>x.date===date());if(q)homeWeight.textContent=q.weight+' kg';document.documentElement.style.setProperty('--bg',db.theme==='orange'?'#35363a':'#08090b');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
