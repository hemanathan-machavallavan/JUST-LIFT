<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Just Lift</title><style>:root{--bg:#08090b;--s:#151619;--s2:#202125;--line:#303137;--t:#f5f5f6;--m:#858790;--a:#ff4b0b;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,Arial,sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:28px;font-weight:900;letter-spacing:-1px}.icon,.btn,.sec{border:1px solid var(--line);background:var(--s);color:var(--t);border-radius:12px;padding:10px 13px}.icon{width:44px;height:44px;border-radius:50%;font-size:18px}.screen{display:none}.active{display:block}.hero,.card{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin:10px 0}.hero{background:linear-gradient(145deg,var(--s2),var(--s));min-height:185px}.pill{display:inline-block;background:#292a2f;color:#bbb;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:800}.hero h1,h1{margin:18px 0 6px;font-size:30px;letter-spacing:-1px}.muted,.sub,.tiny{color:var(--m)}.primary,.save{width:100%;border:0;background:var(--a);color:#111;border-radius:13px;padding:13px;font-weight:900;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.big{font-size:28px;font-weight:900}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#111216ee;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--m);font-size:10px}.nav button b{display:block;font-size:22px}.nav button.sel{color:var(--a)}.exercise{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.exname{font-size:16px;font-weight:800}.target{font-size:11px;color:var(--m);margin-top:4px}.prev{background:var(--s2);border-radius:12px;padding:9px;margin:10px 0;font-size:11px;color:#bbb}.set{display:grid;grid-template-columns:25px 1fr 1fr 38px;gap:6px;align-items:center;margin:7px 0}.input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:10px}.check,.trash,.small{border:1px solid var(--line);background:var(--s2);color:var(--t);border-radius:9px;padding:9px}.check.done{background:var(--a);color:#111}.row{display:flex;align-items:center;gap:8px}.row>*{flex:1}.bar{height:6px;background:#303137;border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--a);width:0}.list{max-height:360px;overflow:auto}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.editor{border:1px solid var(--line);background:var(--s);border-radius:17px;padding:13px;margin:10px 0}.exedit{display:grid;grid-template-columns:1fr 48px 55px 55px 35px;gap:5px;align-items:end;margin-top:8px}.label{font-size:9px;color:var(--m);display:block;margin-bottom:4px}.danger{color:#ff7465}.chart{height:160px;width:100%;margin-top:10px}.toast{position:fixed;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);background:var(--a);color:#111;padding:10px 15px;border-radius:99px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar span{font-size:8px;text-align:center;padding:5px 0;color:#666}.calendar .done{background:#303137;color:#fff;border-radius:50%}.calendar .today{outline:1px solid #fff}.calendar .future{opacity:.3}.goal{line-height:1.55;color:#bbb}</style></head><body><main class="app"><div class="top"><div class="brand">JUST LIFT</div><div class="row" style="flex:0 0 auto"><button class="icon" onclick="toggleTheme()">◐</button><button class="icon" onclick="openPlan()">☷</button></div></div><section id="home" class="screen active"><div class="hero" onclick="openWorkout()"><span class="pill">TODAY'S SESSION</span><h1 id="today"></h1><div class="muted" id="todaySub"></div><button class="primary">Start workout →</button></div><div class="grid"><div class="card stat"><span class="muted">Bodyweight</span><span class="big" id="homeWeight">—</span><span class="tiny">latest</span></div><div class="card stat"><span class="muted">Workouts logged</span><span class="big" id="workCount">0</span><span class="tiny">all time</span></div></div><div class="card"><div class="row"><b>90-day consistency</b><span class="tiny" id="streak"></span></div><div class="calendar" id="cal"></div></div><div class="card"><div class="row"><b>Weekly volume</b><span class="tiny" id="vol"></span></div><div class="bar"><i id="volbar"></i></div></div></section><section id="workout" class="screen"><button class="btn" onclick="go('home')">← Home</button><div class="card"><span class="pill">TODAY</span><h1 id="wtitle"></h1><div class="muted">Use previous performance to beat your last session.</div><div class="bar"><i id="wbar"></i></div></div><div id="exlist"></div><button class="save" onclick="saveWorkout()">Save workout ✓</button></section><section id="history" class="screen"><h1>History</h1><div class="card list" id="historyList"></div></section><section id="progress" class="screen"><h1>Progress</h1><div class="grid"><div class="card"><span class="muted">Sessions</span><div class="big" id="pSessions">0</div></div><div class="card"><span class="muted">Best total load</span><div class="big" id="pLoad">0</div></div></div><div class="card"><b>Strength records</b><div id="records"></div><canvas id="weightChart" class="chart"></canvas></div></section><section id="body" class="screen"><h1>Body</h1><div id="bodyContent"></div></section><section id="plan" class="screen"><button class="btn" onclick="go('home')">← Home</button><h1>Plan</h1><div id="planContent"></div></section></main><nav class="nav"><button class="sel" onclick="nav('home',this)"><b>⌂</b>Home</button><button onclick="nav('history',this)"><b>▣</b>History</button><button onclick="nav('progress',this)"><b>▥</b>Progress</button><button onclick="nav('body',this)"><b>◉</b>Body</button></nav><div id="toast" class="toast"></div><script>const K='justLiftDBv6',oldK='justLiftDBv1';const defaultWorkouts={'Push A':[['Bench Press',3,5,8],['Incline DB Press',3,6,10],['DB Shoulder Press',2,6,10],['Cable Lateral Raise',4,12,20],['Cable Fly',2,10,15],['Triceps Pushdown',3,8,12],['Overhead Cable Triceps Extension',2,10,15]],'Pull A':[['Pull-up',4,5,8],['Barbell Row',3,6,8],['Lat Pulldown',3,8,12],['Chest-Supported Row',2,8,12],['Reverse Pec Deck',3,12,20],['Incline DB Curl',3,8,12],['Hammer Curl',2,10,15]],'Legs A':[['Back Squat',3,5,8],['RDL',3,6,10],['Leg Press',3,8,12],['Leg Curl',3,10,15],['Standing Calf Raise',4,8,15],['Hanging Leg Raise',3,8,15]],'Push B':[['Incline DB Press',3,8,10],['Machine Chest Press',3,8,12],['Cable Fly',2,12,15],['Cable Lateral Raise',4,12,20],['Rear-Delt Cable Fly',2,15,20],['Dips',2,6,12],['Cable Triceps Extension',3,10,15]],'Pull B':[['Lat Pulldown',3,6,10],['Chest-Supported Row',3,8,12],['Single-Arm Cable Lat Pulldown',2,10,15],['Seated Cable Row',3,8,12],['Reverse Pec Deck',3,12,20],['Preacher Curl',3,8,12],['Bayesian Cable Curl',2,10,15]],'Legs B':[['Front Squat',3,6,10],['Bulgarian Split Squat',3,8,12],['RDL',2,8,10],['Leg Extension',3,10,15],['Seated Leg Curl',3,10,15],['Seated Calf Raise',4,10,15],['Cable Crunch',3,10,15]]};const defaultSchedule={'0':'Rest','1':'Push A','2':'Pull A','3':'Legs A','4':'Push B','5':'Pull B','6':'Legs B'};function clone(x){return JSON.parse(JSON.stringify(x))}let db=load(),draft=null,workDraft=null;function load(){let x=JSON.parse(localStorage.getItem(K)||'null');if(!x)x=JSON.parse(localStorage.getItem(oldK)||'null');if(!x)x={workouts:clone(defaultWorkouts),schedule:clone(defaultSchedule),logs:{},weights:[],bodyHistory:{},theme:'dark'};x.workouts=x.workouts||clone(defaultWorkouts);x.schedule=x.schedule||clone(defaultSchedule);x.logs=x.logs||{};x.weights=x.weights||[];x.bodyHistory=x.bodyHistory||{};return x}function save(){localStorage.setItem(K,JSON.stringify(db));localStorage.setItem('justLiftDBv5',JSON.stringify(db))}function today(){return new Date().toISOString().slice(0,10)}function dow(){return new Date().getDay()}function currentName(){return db.schedule[String(dow())]||'Rest'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function theme(){document.body.classList.toggle('orange',db.theme==='orange');if(db.theme==='orange'){document.documentElement.style.setProperty('--bg','#35363a');document.documentElement.style.setProperty('--s','#27282b');document.documentElement.style.setProperty('--s2','#3c3d41')}else{document.documentElement.style.setProperty('--bg','#08090b');document.documentElement.style.setProperty('--s','#151619');document.documentElement.style.setProperty('--s2','#202125')}}function toggleTheme(){db.theme=db.theme==='orange'?'dark':'orange';theme();save()}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')renderHome();if(id==='history')renderHistory();if(id==='progress')renderProgress();if(id==='body')renderBody();if(id==='plan')renderPlan()}function nav(id,b){go(id);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function workoutForDate(d){let k=String(new Date(d+'T12:00:00').getDay());return db.schedule[k]||'Rest'}function prevLog(name){let ds=Object.keys(db.logs).filter(d=>d<today()&&db.logs[d].name===name).sort().reverse();return ds[0]?db.logs[ds[0]]:null}function openWorkout(){let name=currentName();if(name==='Rest'){toast('Rest day');return}let ex=db.workouts[name]||[],p=prevLog(name);workDraft=clone(ex);document.getElementById('wtitle').textContent=name;document.getElementById('exlist').innerHTML=ex.map((e,i)=>{let prev=p?.ex?.[e[0]]||[];return `<div class="exercise"><div class="exname">${esc(e[0])}</div><div class="target">${e[1]} sets × ${e[2]}–${e[3]} reps</div>${prev.length?`<div class="prev"><b>Previous:</b> ${prev.map(x=>x.w+' kg × '+x.r).join(' · ')}</div>`:''}<div id="sets${i}">${Array.from({length:e[1]},(_,j)=>{let q=prev[j]||{};return `<div class="set"><span>${j+1}</span><input class="input wt" type="number" step="0.5" value="${q.w??''}" placeholder="kg"><input class="input rp" type="number" value="${q.r??''}" placeholder="reps"><button class="check" onclick="this.classList.toggle('done')">✓</button></div>`}).join('')}</div><button class="small" onclick="addSet(${i})">＋ set</button></div>`}).join('');go('workout')}function addSet(i){let box=document.getElementById('sets'+i);let n=box.querySelectorAll('.set').length;box.insertAdjacentHTML('beforeend',`<div class="set"><span>${n+1}</span><input class="input wt" type="number" step="0.5" placeholder="kg"><input class="input rp" type="number" placeholder="reps"><button class="check" onclick="this.classList.toggle('done')">✓</button></div>`)}function saveWorkout(){let name=document.getElementById('wtitle').textContent,o={name,ex:{}};document.querySelectorAll('.exercise').forEach((el,i)=>{let a=[];el.querySelectorAll('.set').forEach(s=>{let w=s.querySelector('.wt').value,r=s.querySelector('.rp').value;if(w&&r)a.push({w:+w,r:+r})});o.ex[workDraft[i][0]]=a});db.logs[today()]=o;save();toast('Workout saved ✓');setTimeout(()=>go('home'),400)}function renderHome(){let n=currentName();document.getElementById('today').textContent=n;document.getElementById('todaySub').textContent=n==='Rest'?'Recovery day':(db.workouts[n]?.length||0)+' exercises · progressive overload';let w=db.weights.at(-1);document.getElementById('homeWeight').textContent=w?w.weight+' kg':'—';document.getElementById('workCount').textContent=Object.keys(db.logs).length;let done=Object.keys(db.logs),last=0;for(let i=0;i<90;i++){let d=new Date();d.setDate(d.getDate()-i);if(db.logs[d.toISOString().slice(0,10)])last++;else if(i>0)break}document.getElementById('streak').textContent=last+' day streak';let cal='';for(let i=89;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let s=d.toISOString().slice(0,10);cal+=`<span class="${db.logs[s]?'done ':''}${s===today()?'today':''}${i>0&&i<0?'future':''}">${d.getDate()}</span>`}document.getElementById('cal').innerHTML=cal;let sets=0;Object.values(db.logs).forEach(l=>Object.values(l.ex).forEach(a=>sets+=a.length));document.getElementById('vol').textContent=sets+' sets';document.getElementById('volbar').style.width=Math.min(100,sets/120*100)+'%'}function renderHistory(){let ds=Object.keys(db.logs).sort().reverse();document.getElementById('historyList').innerHTML=ds.length?ds.map(d=>{let l=db.logs[d],sets=Object.values(l.ex).reduce((a,x)=>a+x.length,0);return `<div class="item"><b>${d}</b><br><span class="muted">${esc(l.name)} · ${sets} sets</span></div>`}).join(''):'<div class="muted">No workouts logged yet.</div>'}function renderProgress(){let best={},load=0;Object.values(db.logs).forEach(l=>Object.values(l.ex).forEach(a=>a.forEach(x=>{load+=x.w*x.r;let n='';Object.entries(l.ex).forEach(([k,v])=>{if(v.includes(x))n=k});best[n]=Math.max(best[n]||0,x.w)})));document.getElementById('pSessions').textContent=Object.keys(db.logs).length;document.getElementById('pLoad').textContent=Math.round(load)+' kg';document.getElementById('records').innerHTML=Object.keys(best).length?Object.entries(best).map(x=>`<div class="item"><b>${esc(x[0])}</b><br><span style="color:var(--a)">${x[1]} kg best</span></div>`).join(''):'<p class="muted">Log workouts to build records.</p>';drawChart()}function drawChart(){let c=document.getElementById('weightChart'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);let a=db.weights.slice(-30);if(a.length<2)return;let mn=Math.min(...a.map(x=>x.weight)),mx=Math.max(...a.map(x=>x.weight));ctx.strokeStyle='#ff4b0b';ctx.lineWidth=3;ctx.beginPath();a.forEach((x,i)=>{let px=i*(r.width-20)/(a.length-1)+10,py=r.height-15-(x.weight-mn)/((mx-mn)||1)*(r.height-30);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}function renderBody(){let dates=Object.keys(db.bodyHistory).sort().reverse(),latest=dates[0]||today(),r=db.bodyHistory[latest]||{};document.getElementById('bodyContent').innerHTML=`<div class="card"><div class="row"><b>Daily body log</b><span class="tiny">${dates.length} days</span></div><input class="input" id="bd" type="date" value="${latest}" onchange="loadBodyDate(this.value)"><div class="grid">${[['weight','Weight','kg'],['waist','Waist','cm'],['chest','Chest','cm'],['arm','Arm','cm'],['thigh','Thigh','cm']].map(x=>`<div><label class="label">${x[1]} · ${x[2]}</label><input class="input" id="b${x[0]}" type="number" step="0.1" value="${r[x[0]]??''}"></div>`).join('')}</div><button class="save" onclick="saveBody()">Save this day ✓</button></div><div class="card"><b>Body history</b>${dates.length?dates.slice(0,30).map(d=>{let x=db.bodyHistory[d];return `<div class="item" onclick="loadBodyDate('${d}')"><b>${d}</b><br><span class="muted">${x.weight||'—'} kg · waist ${x.waist||'—'} cm · chest ${x.chest||'—'} cm</span></div>`}).join(''):'<p class="muted">No body records yet.</p>'}</div><div class="card"><b>Your goal</b><p class="goal">68–70 kg lean and athletic. Judge progress using bodyweight, waist, photos, measurements and strength together.</p></div><div class="card"><b>Data backup</b><p class="tiny">Export before major updates or reinstalling.</p><div class="row"><button class="sec" onclick="exportData()">Export JSON</button><button class="sec" onclick="importData()">Import</button></div></div>`}function loadBodyDate(d){let r=db.bodyHistory[d]||{};document.getElementById('bd').value=d;['weight','waist','chest','arm','thigh'].forEach(k=>document.getElementById('b'+k).value=r[k]??'')}function saveBody(){let d=document.getElementById('bd').value||today(),r={};['weight','waist','chest','arm','thigh'].forEach(k=>{let v=document.getElementById('b'+k).value;r[k]=v===''?'':+v});if(!Object.values(r).some(x=>x!=='')){toast('Enter a measurement');return}db.bodyHistory[d]=r;if(r.weight!==''){db.weights=db.weights.filter(x=>x.date!==d);db.weights.push({date:d,weight:r.weight});db.weights.sort((a,b)=>a.date.localeCompare(b.date))}save();toast('Body data saved ✓');renderBody()}function openPlan(){draft={workouts:clone(db.workouts),schedule:clone(db.schedule)};go('plan')}function renderPlan(){let names=Object.keys(draft.workouts),days=[['0','Sunday'],['1','Monday'],['2','Tuesday'],['3','Wednesday'],['4','Thursday'],['5','Friday'],['6','Saturday']];document.getElementById('planContent').innerHTML=`<div class="card"><b>Customize plan</b><p class="tiny">Changes apply only after Save plan changes.</p><button class="save" onclick="addWorkout()">＋ Add new workout</button></div><div class="card"><b>Weekly schedule</b>${days.map(d=>`<div class="row"><span>${d[1]}</span><select onchange="draft.schedule['${d[0]}']=this.value"><option>Rest</option>${names.map(n=>`<option ${draft.schedule[d[0]]===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`).join('')}</div>${names.map((n,i)=>`<div class="editor"><div class="row"><input class="input" value="${esc(n)}" oninput="renameWorkout('${esc(n)}',this.value)"><button class="small danger" onclick="removeWorkout('${esc(n)}')">×</button></div>${draft.workouts[n].map((e,j)=>`<div class="exedit"><div><label class="label">Exercise</label><input class="input" value="${esc(e[0])}" oninput="editEx('${esc(n)}',${j},0,this.value)"></div><div><label class="label">Sets</label><input class="input" type="number" value="${e[1]}" oninput="editEx('${esc(n)}',${j},1,this.value)"></div><div><label class="label">Min</label><input class="input" type="number" value="${e[2]}" oninput="editEx('${esc(n)}',${j},2,this.value)"></div><div><label class="label">Max</label><input class="input" type="number" value="${e[3]}" oninput="editEx('${esc(n)}',${j},3,this.value)"></div><button class="small danger" onclick="delEx('${esc(n)}',${j})">×</button></div>`).join('')}<button class="small" onclick="addEx('${esc(n)}')">＋ Add exercise</button></div>`).join('')}<div class="row"><button class="sec" onclick="go('home')">Cancel</button><button class="save" style="margin-top:0" onclick="savePlan()">Save plan changes ✓</button></div>`}function renameWorkout(old,nw){nw=nw.trim();if(!nw||nw===old)return;let x=draft.workouts[old];delete draft.workouts[old];draft.workouts[nw]=x;Object.keys(draft.schedule).forEach(k=>{if(draft.schedule[k]===old)draft.schedule[k]=nw});renderPlan()}function addWorkout(){let n=1,name='Workout '+n;while(draft.workouts[name])name='Workout '+(++n);draft.workouts[name]=[['New Exercise',3,8,12]];renderPlan();toast('New workout added')}function removeWorkout(n){if(Object.keys(draft.workouts).length<=1){toast('Keep one workout');return}if(!confirm('Remove '+n+'?'))return;delete draft.workouts[n];Object.keys(draft.schedule).forEach(k=>{if(draft.schedule[k]===n)draft.schedule[k]='Rest'});renderPlan()}function editEx(n,j,k,v){if(draft.workouts[n])draft.workouts[n][j][k]=k?Math.max(1,+v||1):v}function addEx(n){draft.workouts[n].push(['New Exercise',3,8,12]);renderPlan()}function delEx(n,j){if(draft.workouts[n].length<=1){toast('Keep one exercise');return}draft.workouts[n].splice(j,1);renderPlan()}function savePlan(){let names=Object.keys(draft.workouts).map(x=>x.trim());if(new Set(names.map(x=>x.toLowerCase())).size!==names.length){toast('Workout names must be unique');return}db.workouts=draft.workouts;db.schedule=draft.schedule;save();draft=null;toast('Plan changes saved ✓');setTimeout(()=>go('home'),400)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='just-lift-backup.json';a.click()}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);db.workouts=db.workouts||clone(defaultWorkouts);db.schedule=db.schedule||clone(defaultSchedule);db.logs=db.logs||{};db.weights=db.weights||[];db.bodyHistory=db.bodyHistory||{};save();location.reload()}catch{toast('Invalid backup')}};r.readAsText(e.target.files[0])};i.click()}theme();renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
